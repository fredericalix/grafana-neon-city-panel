# Every target carries a `name` label equal to its building name in the
# neon-city panel layout, and a `service` label grouping HA replicas.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend-1:8080"]
        labels: { name: backend-1, service: backend }
      - targets: ["backend-2:8080"]
        labels: { name: backend-2, service: backend }

  - job_name: frontend
    static_configs:
      - targets: ["frontend-1:8080"]
        labels: { name: frontend-1, service: frontend }
      - targets: ["frontend-2:8080"]
        labels: { name: frontend-2, service: frontend }

  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:8080"]
        labels: { name: loadgen, service: loadgen }

  - job_name: traefik
    static_configs:
      - targets: ["traefik:9101"]
        labels: { name: traefik, service: traefik }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { name: postgres, service: postgres }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { name: prometheus, service: prometheus }

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: { name: grafana, service: grafana }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: { name: cadvisor, service: cadvisor }
