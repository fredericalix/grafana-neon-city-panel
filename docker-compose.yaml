services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      # The plugin requires Grafana >= 13.1.4 (grafanaDependency) — default
      # the dev server to it instead of the 12.3.2 default in
      # .config/docker-compose-base.yaml.
      args:
        grafana_version: ${GRAFANA_VERSION:-13.1.4}
